<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistify | Ready to solve a problem?</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-deep: #02010a;
            --text-main: #f8fafc;
            /* Assistify Brand Color Palette (Neon Emerald & Cyber Cyan) */
            --accent-emerald: #00ffaa;
            --accent-cyan: #00f3ff;
            --accent-violet: #8a2be2;
            /* 2% Opacity Background Palette */
            --glass-card: rgba(4, 18, 12, 0.02); 
            --glass-border: rgba(0, 255, 170, 0.35);
            --btn-bg: rgba(6, 28, 20, 0.02);
            --dual-gradient: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Background Canvas Layer */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Cyber HUD Card Frame */
        .cyber-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 460px;
            margin: 40px auto;
            padding: 42px 26px;
            background: var(--glass-card);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 0 35px rgba(0, 255, 170, 0.2),
                0 0 70px rgba(0, 243, 255, 0.15),
                inset 0 0 15px rgba(255, 255, 255, 0.02);
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Sci-Fi HUD Corner Brackets */
        .cyber-card::before, .cyber-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        .cyber-card::before {
            top: 12px; left: 12px;
            border-top: 2px solid var(--accent-emerald);
            border-left: 2px solid var(--accent-emerald);
        }
        .cyber-card::after {
            bottom: 12px; right: 12px;
            border-bottom: 2px solid var(--accent-cyan);
            border-right: 2px solid var(--accent-cyan);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Mech Avatar with Emerald & Cyan Energy Rings */
        .avatar-wrapper {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 22px;
            perspective: 800px;
        }

        .avatar-ring-emerald {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 144px;
            height: 144px;
            border-radius: 50%;
            border: 2px dashed var(--accent-emerald);
            animation: spinClockwise 16s linear infinite;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
        }

        .avatar-ring-cyan {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-cyan);
            border-bottom-color: var(--accent-violet);
            animation: spinCounter 10s linear infinite;
        }

        @keyframes spinClockwise {
            100% { transform: rotate(360deg); }
        }
        @keyframes spinCounter {
            100% { transform: rotate(-360deg); }
        }

        /* Holographic Rotating Buddha Avatar Box */
        .buddha-avatar-box {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(2, 16, 12, 0.4);
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 255, 170, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .buddha-svg {
            width: 76px;
            height: 76px;
            animation: floatRotateBuddha 7s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes floatRotateBuddha {
            0% {
                transform: rotateY(0deg) scale(1);
                filter: drop-shadow(0 0 8px var(--accent-emerald)) drop-shadow(0 0 16px var(--accent-cyan));
            }
            50% {
                transform: rotateY(180deg) scale(0.92);
                filter: drop-shadow(0 0 12px var(--accent-cyan)) drop-shadow(0 0 20px var(--accent-violet));
            }
            100% {
                transform: rotateY(360deg) scale(1);
                filter: drop-shadow(0 0 8px var(--accent-emerald)) drop-shadow(0 0 16px var(--accent-cyan));
            }
        }

        /* Header & Neon Branding */

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;

        .robot-icon {

        h1 {

            font-weight: 700;

            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.7);

        .bio {

            margin-bottom: 26px;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);

        /* Social Icons */
        .social-grid {

        .social-link {

        .social-link:hover {

        /* Link Buttons */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            text-align: centre;
            gap: 14px;
            margin-bottom: 32px;
        }

        .mecha-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--btn-bg);
            backdrop-filter: blur(1px);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(0, 243, 255, 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
        }

        .mecha-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-emerald);
            transition: all 0.3s ease;
        }

        .mecha-btn:hover {
            border-color: var(--accent-emerald);
            transform: translateX(4px) translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 170, 0.35);
            background: rgba(0, 255, 170, 0.15);
        }

        .mecha-btn:hover::before {
            width: 100%;
            background: var(--dual-gradient);
            opacity: 0.15;
        }

        .btn-tag {
            font-size: 10px;
            padding: 4px 8px;
            background: rgba(0, 255, 170, 0.15);
            border: 1px solid var(--accent-emerald);
            color: var(--accent-emerald);
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .mecha-btn:hover .btn-tag {
            background: rgba(0, 243, 255, 0.25);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Contact Box */
        .contact-box {
            background: rgba(4, 18, 12, 0.02);
            backdrop-filter: blur(1px);
            padding: 22px 18px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 170, 0.25);
            text-align: left;
            position: relative;
        }

        .contact-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            color: var(--accent-emerald);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;

            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;

            border: none;

            font-weight: 900;

            letter-spacing: 1.5px;
            cursor: pointer;

            box-shadow: 0 4px 20px rgba(0, 255, 170, 0.4);
        }

        .submit-btn:hover {
            box-shadow: 0 6px 25px rgba(0, 243, 255, 0.6);
            transform: translateY(-2px);
            filter: brightness(1.15);
        }
    </style>

    <!-- 3D Multiverse, Planets & Tiny Spaceship Swarm Engine Script -->
    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. Cosmic Lighting Setup (Emerald & Cyan Highlights)
        const ambientLight = new THREE.AmbientLight(0x112233, 1.2);
        scene.add(ambientLight);

        const emeraldLight = new THREE.PointLight(0x00ffaa, 4, 80);
        emeraldLight.position.set(-20, 15, 10);
        scene.add(emeraldLight);

        const cyanLight = new THREE.PointLight(0x00f3ff, 4, 80);
        cyanLight.position.set(20, -15, 10);
        scene.add(cyanLight);

        // 2. Cosmic Spiral Galaxy (Emerald & Cyan Palette)
        const galaxyParticleCount = 2800;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyParticleCount * 3);
        const galaxyColors = new Float32Array(galaxyParticleCount * 3);

        const colorEmerald = new THREE.Color(0x00ffaa);
        const colorCyan = new THREE.Color(0x00f3ff);
        const colorViolet = new THREE.Color(0x8a2be2);

        for (let i = 0; i < galaxyParticleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 32 + 2;
            const spinAngle = radius * 0.4;
            const branchAngle = ((i % 2) * Math.PI); 

            const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;

            galaxyPositions[i3] = Math.cos(spinAngle + branchAngle) * radius + randomX;
            galaxyPositions[i3 + 1] = randomY;
            galaxyPositions[i3 + 2] = Math.sin(spinAngle + branchAngle) * radius + randomZ;

            let mixedColor = colorEmerald.clone();
            if (i % 2 === 0) {
                mixedColor.lerp(colorCyan, radius / 32);
            } else {
                mixedColor.lerp(colorViolet, Math.random());
            }

            galaxyColors[i3] = mixedColor.r;
            galaxyColors[i3 + 1] = mixedColor.g;
            galaxyColors[i3 + 2] = mixedColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 0.16,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
        galaxy.position.z = -6;
        galaxy.rotation.x = Math.PI / 5;
        scene.add(galaxy);

        // 3. Deep Space Stars Background
        const starCount = 1000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 90;
            starPos[i + 1] = (Math.random() - 0.5) * 90;
            starPos[i + 2] = (Math.random() - 0.5) * 90;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.7 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 4. PLANETS CREATION
        // Planet 1: Ringed Gas Giant
        const planetGroup1 = new THREE.Group();
        const planetGeo1 = new THREE.SphereGeometry(3.2, 64, 64);
        const planetMat1 = new THREE.MeshPhongMaterial({
            color: 0x051a14,
            emissive: 0x003322,
            specular: 0x00f3ff,
            shininess: 30
        });
        const planet1 = new THREE.Mesh(planetGeo1, planetMat1);
        planetGroup1.add(planet1);

        // Planet 1 Orbital Ring
        const ringGeo = new THREE.RingGeometry(4.2, 6.5, 64);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x00ffaa,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.65,
            roughness: 0.3
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.2;
        planetGroup1.add(ring);

        planetGroup1.position.set(9, -2, -8);
        scene.add(planetGroup1);

        // Planet 2: Small Ice Moon
        const planetGeo2 = new THREE.SphereGeometry(1.4, 32, 32);
        const planetMat2 = new THREE.MeshPhongMaterial({
            color: 0x002244,
            emissive: 0x001122,
            specular: 0x00ffaa,
            shininess: 15
        });
        const planet2 = new THREE.Mesh(planetGeo2, planetMat2);
        planet2.position.set(-10, 6, -10);
        scene.add(planet2);

        // 5. TINY SPACESHIPS FLEET CREATION
        function createTinySpaceship(engineColorHex) {
            const shipGroup = new THREE.Group();

            // Cockpit / Fuselage
            const bodyGeo = new THREE.ConeGeometry(0.4, 2.0, 5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0d1f1a, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            shipGroup.add(body);

            // Wing Structure
            const wingGeo = new THREE.BoxGeometry(2.0, 0.04, 0.7);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x051410, metalness: 0.9 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.z = 0.2;
            shipGroup.add(wings);

            // Engine Glow
            const engineGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.4, 12);
            const engineMat = new THREE.MeshBasicMaterial({ color: engineColorHex });
            const engine = new THREE.Mesh(engineGeo, engineMat);
            engine.rotation.x = Math.PI / 2;
            engine.position.z = 1.1;
            shipGroup.add(engine);

            // Micro scale
            shipGroup.scale.set(0.18, 0.18, 0.18);
            return shipGroup;
        }

        // Generate squad of 7 tiny spaceships
        const tinyShips = [];
        const engineColors = [0x00ffaa, 0x00f3ff, 0x8a2be2, 0xffaa00, 0x00ffcc];

        for (let i = 0; i < 7; i++) {
            const color = engineColors[i % engineColors.length];
            const ship = createTinySpaceship(color);
            scene.add(ship);

            tinyShips.push({
                mesh: ship,
                speed: 0.25 + Math.random() * 0.35,
                radiusX: 9 + Math.random() * 8,
                radiusY: 2 + Math.random() * 5,
                radiusZ: 6 + Math.random() * 8,
                offset: Math.random() * Math.PI * 2,
                heightOffset: (Math.random() - 0.5) * 8
            });
        }

        camera.position.z = 18;

        // Interactive Parallax Tracking
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotate background galaxy & planets
            galaxy.rotation.y = time * 0.04;
            starField.rotation.y = time * 0.008;

            planet1.rotation.y = time * 0.1;
            planetGroup1.rotation.z = Math.sin(time * 0.2) * 0.08;
            planet2.rotation.y = time * 0.15;

            // Animate Tiny Spaceships Fleet Flight Paths
            tinyShips.forEach((item, idx) => {
                const t = time * item.speed + item.offset;
                const sign = (idx % 2 === 0) ? 1 : -1;

                item.mesh.position.x = Math.sin(t * sign) * item.radiusX;
                item.mesh.position.y = Math.cos(t * 1.3) * item.radiusY + item.heightOffset;
                item.mesh.position.z = Math.cos(t * sign) * item.radiusZ - 4;

                item.mesh.rotation.y = -t * sign + (sign > 0 ? Math.PI / 2 : -Math.PI / 2);
                item.mesh.rotation.z = Math.sin(t * 2) * 0.2;
            });

            // Parallax Camera Reaction
            camera.position.x += (mouseX * 2.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
