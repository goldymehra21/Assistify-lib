<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistify | Get Help Move Forward</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --white:#f4f4f4;
    --light:#ffffff;
    --dark:#cfcfcf;
    --shadow-dark:#c8c8c8;
    --shadow-light:#ffffff;
    --red:#c91624;
    --red-dark:#a70e19;
    --text:#202124;
    --muted:#707070;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#050505;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:25px 12px;
}


/* =========================================
   MAIN EMBOSSED DEVICE
========================================= */

.page{
    width:100%;
    max-width:760px;
    min-height:calc(100vh - 50px);

    background:linear-gradient(
        145deg,
        #ffffff,
        #eeeeee
    );

    border-radius:55px;

    padding:48px 42px 28px;

    position:relative;
    overflow:hidden;

    box-shadow:
        18px 18px 45px rgba(0,0,0,.45),
        -12px -12px 35px rgba(255,255,255,.08),
        inset 3px 3px 10px rgba(255,255,255,.9),
        inset -4px -4px 12px rgba(180,180,180,.5);
}


/* RED TOP DETAIL */

.page::before{
    content:"";

    position:absolute;
    top:0;
    left:50%;

    transform:translateX(-50%);

    width:310px;
    height:15px;

    background:var(--red);

    border-radius:0 0 30px 30px;

    box-shadow:
        0 4px 8px rgba(201,22,36,.35),
        inset 0 -3px 4px rgba(120,0,0,.25);
}


/*
   IMPORTANT:
   The previous decorative page::after
   has been completely removed.

   This removes the white flare/glow
   appearing around the contact section.
*/


/* =========================================
   BUDDHA LOGO
========================================= */

.logo-wrap{
    width:185px;
    height:185px;

    margin:0 auto 24px;

    border-radius:50%;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e5e5e5
    );

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    box-shadow:
        12px 12px 25px #c7c7c7,
        -12px -12px 25px #ffffff,
        inset 3px 3px 8px rgba(255,255,255,.9),
        inset -4px -4px 10px rgba(190,190,190,.5);
}

.logo-inner{
    width:145px;
    height:145px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #f9f9f9,
        #e7e7e7
    );

    box-shadow:
        inset 5px 5px 12px rgba(190,190,190,.55),
        inset -5px -5px 12px rgba(255,255,255,.9),
        4px 4px 10px rgba(180,180,180,.25);
}

.buddha{
    color:var(--red);

    font-size:78px;

    filter:
        drop-shadow(2px 2px 2px #8e8e8e)
        drop-shadow(-1px -1px 1px #ffffff);
}


/* =========================================
   BRAND
========================================= */

.brand{
    text-align:center;
}

.brand h1{
    font-size:58px;

    font-weight:900;

    letter-spacing:10px;

    line-height:1;

    color:#222;

    text-shadow:
        2px 2px 2px #bcbcbc,
        -1px -1px 1px #ffffff;
}

.brand h1 span{
    color:var(--red);

    text-shadow:
        2px 2px 2px #9e9e9e,
        -1px -1px 1px #ffffff;
}

.brand-line{
    width:300px;
    height:4px;

    margin:22px auto 18px;

    background:var(--red);

    border-radius:10px;

    box-shadow:
        0 2px 3px #aaa,
        inset 0 1px 1px rgba(255,255,255,.5);
}

.brand-subtitle{
    font-size:19px;

    letter-spacing:8px;

    color:#555;

    font-weight:500;
}


/* =========================================
   GET HELP MOVE FORWARD PILL
========================================= */

.info-pill{
    margin:28px auto 25px;

    width:min(470px,90%);

    min-height:58px;

    border-radius:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e8e8e8
    );

    box-shadow:
        8px 8px 16px #c8c8c8,
        -8px -8px 16px #ffffff,
        inset 2px 2px 5px rgba(255,255,255,.9),
        inset -2px -2px 5px rgba(190,190,190,.35);

    color:var(--red);

    font-size:17px;

    font-weight:900;

    letter-spacing:4px;

    text-transform:uppercase;

    text-shadow:
        1px 1px 1px #ffffff,
        1px 2px 2px rgba(120,0,0,.25);
}


/* =========================================
   SOCIAL ICONS
========================================= */

.social{
    display:flex;

    justify-content:center;

    gap:22px;

    margin:22px 0 34px;
}

.social a{
    width:78px;
    height:78px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:var(--red);

    background:linear-gradient(
        145deg,
        #ffffff,
        #e7e7e7
    );

    font-size:32px;

    box-shadow:
        8px 8px 17px #c6c6c6,
        -8px -8px 17px #ffffff,
        inset 2px 2px 5px rgba(255,255,255,.8),
        inset -2px -2px 5px rgba(180,180,180,.35);

    transition:.25s ease;
}

.social a:hover{
    transform:translateY(-4px);

    color:#fff;

    background:var(--red);

    box-shadow:
        5px 5px 12px #aaa,
        -5px -5px 12px #fff,
        0 8px 20px rgba(201,22,36,.25);
}


/* =========================================
   MAIN LINK CARDS
========================================= */

.links{
    display:flex;

    flex-direction:column;

    gap:22px;

    margin-bottom:30px;
}

.link-card{
    min-height:120px;

    display:flex;

    align-items:center;

    text-decoration:none;

    color:var(--text);

    padding:18px 25px;

    border-radius:35px;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e9e9e9
    );

    border-left:8px solid var(--red);

    box-shadow:
        10px 10px 20px #c6c6c6,
        -10px -10px 20px #ffffff,
        inset 2px 2px 5px rgba(255,255,255,.8),
        inset -2px -2px 6px rgba(180,180,180,.3);

    transition:.25s ease;
}

.link-card:hover{
    transform:translateY(-4px);

    box-shadow:
        6px 6px 15px #bdbdbd,
        -6px -6px 15px #ffffff,
        0 8px 22px rgba(201,22,36,.16);
}

.link-icon{
    width:75px;
    height:75px;

    min-width:75px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--red);

    font-size:30px;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e7e7e7
    );

    box-shadow:
        7px 7px 14px #c7c7c7,
        -7px -7px 14px #ffffff,
        inset 2px 2px 5px rgba(255,255,255,.9),
        inset -2px -2px 5px rgba(180,180,180,.35);
}

.link-content{
    flex:1;

    margin-left:25px;
}

.link-label{
    color:var(--red);

    font-size:15px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:5px;
}

.link-title{
    font-size:25px;

    font-weight:800;

    margin-bottom:5px;
}

.link-desc{
    font-size:15px;

    color:#686868;

    letter-spacing:1px;
}

.arrow{
    width:60px;
    height:60px;

    min-width:60px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--red);

    font-size:22px;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e7e7e7
    );

    box-shadow:
        6px 6px 12px #c6c6c6,
        -6px -6px 12px #ffffff,
        inset 2px 2px 4px rgba(255,255,255,.8);
}


/* =========================================
   CONTACT SECTION
========================================= */

.contact{

    border-radius:38px;

    padding:28px;

    /*
       CLEAN FLAT EMBOSSED SURFACE
       No white flare / radial glow.
    */

    background:linear-gradient(
        145deg,
        #f8f8f8,
        #e6e6e6
    );

    box-shadow:
        10px 10px 22px #c4c4c4,
        -10px -10px 22px #ffffff,
        inset 2px 2px 6px rgba(255,255,255,.9),
        inset -3px -3px 7px rgba(180,180,180,.35);
}

.contact-header{
    display:flex;

    align-items:center;

    gap:18px;

    margin-bottom:20px;
}

.contact-icon{
    width:62px;
    height:62px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--red);

    font-size:25px;

    background:linear-gradient(
        145deg,
        #ffffff,
        #e8e8e8
    );

    box-shadow:
        6px 6px 12px #c6c6c6,
        -6px -6px 12px #ffffff;
}

.contact-title{
    font-size:21px;

    font-weight:900;

    letter-spacing:4px;

    text-transform:uppercase;
}

.contact-subtitle{
    color:#666;

    margin-top:5px;

    font-size:14px;

    letter-spacing:1px;
}


/* =========================================
   FORM
========================================= */

.form-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

input,
textarea{
    width:100%;

    border:none;

    outline:none;

    padding:17px 20px;

    border-radius:20px;

    background:#eeeeee;

    color:#333;

    font-size:15px;

    box-shadow:
        inset 5px 5px 10px #d1d1d1,
        inset -5px -5px 10px #ffffff;

    margin-bottom:15px;
}

textarea{
    min-height:110px;

    resize:vertical;
}

input:focus,
textarea:focus{

    box-shadow:
        inset 4px 4px 8px #ccc,
        inset -4px -4px 8px #fff,
        0 0 0 2px rgba(201,22,36,.12);
}


/* =========================================
   RED SEND BUTTON
========================================= */

.submit{
    width:100%;

    border:none;

    cursor:pointer;

    padding:18px;

    border-radius:30px;

    background:linear-gradient(
        145deg,
        #ed2635,
        #b90f1c
    );

    color:white;

    font-size:16px;

    font-weight:900;

    letter-spacing:5px;

    box-shadow:
        7px 7px 15px #bcbcbc,
        -7px -7px 15px #ffffff,
        inset 2px 2px 3px rgba(255,255,255,.25);

    transition:.25s ease;
}

.submit:hover{
    transform:translateY(-2px);

    filter:brightness(1.08);
}


/* =========================================
   FOOTER
========================================= */

.footer{
    position:relative;

    z-index:2;

    text-align:center;

    margin-top:30px;

    color:#777;

    font-size:13px;

    letter-spacing:1px;
}

.footer::before,
.footer::after{

    content:"";

    display:inline-block;

    vertical-align:middle;

    width:55px;

    height:2px;

    background:var(--red);

    margin:0 15px;
}

.footer strong{
    color:var(--red);

    font-family:cursive;

    font-size:21px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    body{
        padding:12px 8px;
    }

    .page{
        border-radius:42px;

        padding:35px 18px 25px;
    }

    .page::before{
        width:180px;
        height:11px;
    }

    .logo-wrap{
        width:125px;
        height:125px;

        margin-bottom:20px;
    }

    .logo-inner{
        width:100px;
        height:100px;
    }

    .buddha{
        font-size:55px;
    }

    .brand h1{
        font-size:38px;

        letter-spacing:6px;
    }

    .brand-line{
        width:190px;

        margin:15px auto;
    }

    .brand-subtitle{
        font-size:11px;

        letter-spacing:4px;
    }

    .info-pill{
        min-height:50px;

        font-size:12px;

        letter-spacing:2.5px;

        width:95%;
    }

    .social{
        gap:12px;
    }

    .social a{
        width:58px;
        height:58px;

        font-size:23px;
    }

    .link-card{
        min-height:100px;

        padding:14px;

        border-left-width:6px;

        border-radius:27px;
    }

    .link-icon{
        width:58px;
        height:58px;

        min-width:58px;

        font-size:23px;
    }

    .link-content{
        margin-left:14px;
    }

    .link-label{
        font-size:10px;

        letter-spacing:1.5px;
    }

    .link-title{
        font-size:18px;
    }

    .link-desc{
        font-size:11px;
    }

    .arrow{
        width:45px;
        height:45px;

        min-width:45px;

        font-size:17px;
    }

    .contact{
        padding:20px;

        border-radius:28px;
    }

    .contact-header{
        gap:12px;
    }

    .contact-icon{
        width:52px;
        height:52px;
    }

    .contact-title{
        font-size:15px;

        letter-spacing:2px;
    }

    .form-row{
        grid-template-columns:1fr;

        gap:0;
    }

    .submit{
        font-size:13px;

        letter-spacing:3px;
    }

    .footer{
        font-size:10px;
    }

    .footer::before,
    .footer::after{
        width:25px;

        margin:0 7px;
    }
}

</style>
</head>
